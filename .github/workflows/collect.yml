name: Collect officials

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Collect one source only (its key from data/sources.json). Leave empty for all."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # A few sources build their lists with JavaScript; they are loaded in headless Chromium.
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Collect
        id: collect
        env:
          ONLY: ${{ inputs.only }}
          SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
        run: |
          python -m collector.collect --report collection-report.md --json collection-report.json \
            --proposed collection-proposed.json --only "$ONLY" > /dev/null
          # The full report on the run's summary page (the pull request body is cut off at 65,536 characters).
          cat collection-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save the report with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: |
            collection-report.md
            collection-report.json
          if-no-files-found: ignore

      # Changes are published straight away; the site is redeployed. Held-back changes go to a pull request below.
      - name: Publish the changes and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected.json
          if git diff --cached --quiet; then
            echo "Nothing to save."
            exit 0
          fi
          git commit -m "Update officials from official sources"
          git push
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"

      - name: Offer held-back changes for review
        if: steps.collect.outputs.held == 'true'
        run: |
          cp collection-proposed.json data/collected.json
          python - <<'PY'
          import json
          rows = json.load(open("collection-report.json"))
          held = [r for r in rows if r["held"]]
          lines = ["## Held for review", "",
                   "These sources would lose several people at once, so their published lists were left unchanged. "
                   "Check each against its official page: **merge** to publish the new lists, or **close** to keep the old ones.",
                   "", "| Source | Removed | Added |", "|---|---:|---:|"]
          lines += [f"| {r['name']} | {r['removed']} | {r['added']} |" for r in held]
          lines += ["", "Names are in the full report on the workflow run's summary page."]
          open("held-report.md", "w").write("\n".join(lines) + "\n")
          PY

      - name: Open a pull request with the held-back changes
        if: steps.collect.outputs.held == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data-held-for-review
          add-paths: data/collected.json
          commit-message: "Held-back changes from official sources"
          title: "Data held for review: sources that would lose several people"
          body-path: held-report.md
          delete-branch: true

      # Red only when a statewide or county-wide source fails; city failures are listed as warnings.
      - name: Name each failing source
        if: always()
        run: |
          if [ -f collection-report.json ]; then python -m collector.gate collection-report.json; fi
