name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site data (stops here if a correction is invalid)
        run: python -m collector.publish

      - name: Stamp asset links with this commit, so browsers fetch new code right after a deploy
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(assets/(app\.js|style\.css))\"#\1?v=$v\"#g" site/*.html
          sed -i -E "s#from \"\./lib\.js\"#from \"./lib.js?v=$v\"#" site/assets/app.js
          grep -c "?v=$v" site/representatives.html site/assets/app.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
